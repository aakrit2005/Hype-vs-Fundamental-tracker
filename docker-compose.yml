services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hype
      POSTGRES_PASSWORD: hype
      POSTGRES_DB: hype
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hype -d hype"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://hype:hype@db:5432/hype
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the root .env file}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    command: ["sh", "-c", "python -m app.core.init_db && python -m app.core.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: