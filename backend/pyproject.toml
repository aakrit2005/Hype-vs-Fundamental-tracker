[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hype-fundamentals-tracker"
version = "0.5.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "yfinance>=0.2.36",
    "httpx>=0.26.0",
    "tenacity>=8.2.3",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
ml = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes.
# This is a deliberate, stable rule set for this codebase.
select = ["E", "F"]

# E712 is ignored because SQLAlchemy overloads == for column expressions.
# Writing Ticker.is_active == True is the correct SQLAlchemy pattern.
ignore = ["E712"]

[tool.ruff.lint.per-file-ignores]
# conftest must set environment variables before importing app modules.
# That makes imports appear after code, which is E402.
"tests/conftest.py" = ["E402"]
